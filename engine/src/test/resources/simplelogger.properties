# SLF4J Simple Logger Configuration
# This configuration directs all log output to a file only (no console output)

# Set the default log level (can be: trace, debug, info, warn, error)
org.slf4j.simpleLogger.defaultLogLevel=info

# Show date/time in log output
org.slf4j.simpleLogger.showDateTime=true

# Date/time format
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show logger name
org.slf4j.simpleLogger.showLogName=true

# Show short logger name (last component only)
org.slf4j.simpleLogger.showShortLogName=false

# Log file location (relative to working directory or absolute path)
# This writes to a file named db-engine.log in the current directory
org.slf4j.simpleLogger.logFile=db-engine-test.log

# Disable cache for dynamic configuration (useful for development)
org.slf4j.simpleLogger.cacheOutputStream=false

# Specific logger levels (optional - uncomment to adjust specific loggers)
# org.slf4j.simpleLogger.log.dev.frostlake=debug
# org.slf4j.simpleLogger.log.dev.frostlake.executor=trace
# org.slf4j.simpleLogger.log.dev.frostlake.security=debug
